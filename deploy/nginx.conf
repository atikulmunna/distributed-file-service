# Load balancer for the "cluster" compose profile: round-robin across the app-cluster replicas.
events {}

http {
    upstream dfs_app {
        # Docker's DNS returns one address per replica of app-cluster; nginx balances across them.
        server app-cluster:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 8080;

        client_max_body_size 80m;      # above max_chunk_size_bytes (64 MiB)
        proxy_request_buffering off;   # stream chunk bodies straight to an instance
        proxy_buffering off;           # stream downloads straight to the client
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        location / {
            proxy_pass http://dfs_app;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }
    }
}
