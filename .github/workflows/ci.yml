name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Alembic migrations on a clean SQLite DB
        env:
          DATABASE_URL: sqlite:///./ci_migration_check.db
        run: alembic upgrade head

      - name: Run tests on SQLite
        run: pytest -q

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dfs
          POSTGRES_PASSWORD: dfs
          POSTGRES_DB: dfs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dfs -d dfs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://dfs:dfs@localhost:5432/dfs
      TEST_DATABASE_URL: postgresql+psycopg://dfs:dfs@localhost:5432/dfs_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Alembic migrations on a clean Postgres DB
        run: alembic upgrade head

      - name: Check that models and migrations agree
        run: alembic check

      - name: Run tests on Postgres
        run: pytest -q
