services:
  redis:
    image: redis:7-alpine
    container_name: dfs-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  db:
    image: postgres:16
    container_name: dfs-postgres
    environment:
      POSTGRES_DB: dfs
      POSTGRES_USER: dfs
      POSTGRES_PASSWORD: dfs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dfs -d dfs"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dfs-app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://dfs:dfs@db:5432/dfs
      STORAGE_ROOT: /app/data
      QUEUE_BACKEND: ${QUEUE_BACKEND:-memory}
      REDIS_URL: redis://redis:6379/0
      REDIS_STREAM_NAME: dfs:finalize
      # With QUEUE_BACKEND=redis, set FINALIZER_IN_PROCESS=false and run the "workers" profile.
      FINALIZER_IN_PROCESS: ${FINALIZER_IN_PROCESS:-true}
    ports:
      - "8000:8000"
    volumes:
      - app_data:/app/data

  # Verification workers as their own service (whole-file checksum checks after complete):
  # QUEUE_BACKEND=redis FINALIZER_IN_PROCESS=false docker compose --profile workers up -d
  finalizer:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["workers"]
    command: ["python", "-m", "app.finalizer"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://dfs:dfs@db:5432/dfs
      STORAGE_ROOT: /app/data
      QUEUE_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      REDIS_STREAM_NAME: dfs:finalize
    volumes:
      - app_data:/app/data

  # Benchmark stack: `docker compose --profile bench up -d --build app-bench`.
  # S3-compatible storage is Versity Gateway (MinIO images are no longer publicly pullable).
  # app-bench reads no .env file, so benchmark config is exactly what is written here.
  s3:
    image: versity/versitygw:v1.10.0
    container_name: dfs-s3
    profiles: ["bench", "cluster"]
    environment:
      ROOT_ACCESS_KEY: dfs-local-access
      ROOT_SECRET_KEY: dfs-local-secret-key
      VGW_BACKEND: posix
      VGW_BACKEND_ARG: /data
    ports:
      - "7070:7070"
    volumes:
      - s3_data:/data

  bench-init:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["bench"]
    command: ["python", "scripts/bench_init.py"]
    environment: &bench_env
      DATABASE_URL: postgresql+psycopg://dfs:dfs@db:5432/dfs_bench
      STORAGE_BACKEND: s3
      S3_BUCKET: dfs
      S3_ENDPOINT_URL: http://s3:7070
      AWS_ACCESS_KEY_ID: dfs-local-access
      AWS_SECRET_ACCESS_KEY: dfs-local-secret-key
      AWS_REGION: us-east-1
      QUEUE_BACKEND: memory
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_started

  app-bench:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dfs-app-bench
    profiles: ["bench"]
    environment: *bench_env
    ports:
      - "8001:8000"
    depends_on:
      bench-init:
        condition: service_completed_successfully

  # Two-instance cluster: `docker compose --profile cluster up -d --build`, then use http://localhost:8080.
  # nginx round-robins across 2 app replicas; migrations run once in "migrate"; verification runs in
  # "finalizer-cluster"; Redis carries the job queue and the shared per-user rate limit. No .env file
  # is read, so the cluster's config is exactly what is written here.
  cluster-init:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["cluster"]
    command: ["python", "scripts/bench_init.py"]
    environment: &cluster_env
      DATABASE_URL: postgresql+psycopg://dfs:dfs@db:5432/dfs_cluster
      STORAGE_BACKEND: s3
      S3_BUCKET: dfs-cluster
      S3_ENDPOINT_URL: http://s3:7070
      AWS_ACCESS_KEY_ID: dfs-local-access
      AWS_SECRET_ACCESS_KEY: dfs-local-secret-key
      AWS_REGION: us-east-1
      QUEUE_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      REDIS_STREAM_NAME: dfs:cluster:finalize
      FINALIZER_IN_PROCESS: "false"
      RATE_LIMIT_BACKEND: redis
      API_RATE_LIMIT_PER_MINUTE: "100"
      API_KEY_MAPPINGS: dev-key:dev-user,limit-key:limit-user
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_started

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["cluster"]
    command: ["alembic", "upgrade", "head"]
    environment: *cluster_env
    depends_on:
      cluster-init:
        condition: service_completed_successfully

  app-cluster:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["cluster"]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *cluster_env
    deploy:
      replicas: 2
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  finalizer-cluster:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["cluster"]
    command: ["python", "-m", "app.finalizer"]
    environment: *cluster_env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27.3-alpine
    profiles: ["cluster"]
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app-cluster:
        condition: service_started

volumes:
  postgres_data:
  app_data:
  s3_data:
